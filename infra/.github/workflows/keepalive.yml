name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl -sf --max-time 30 "${{ secrets.RENDER_API_URL }}/api/health" \
            && echo "Backend is warm" \
            || echo "Backend is cold-starting (expected on free tier)"
