name: Lint workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  # Requires an ADMIN_PAT secret (a fine-grained PAT with read-only "Secrets"
  # repo permission) — the default GITHUB_TOKEN can't read actions/secrets.
  # No-ops with a log message until that secret exists, so it won't break CI
  # in the meantime. (The `secrets` context isn't allowed in `if:`, so the
  # gate lives in a check step's output instead.)
  secrets-audit:
    name: Audit secret references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check for ADMIN_PAT
        id: check
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: |
          if [ -n "$ADMIN_PAT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ADMIN_PAT secret not set — skipping secrets audit (see .github/scripts/audit_workflow_secrets.py)"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Audit workflow secret references
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: .github/scripts/audit_workflow_secrets.py
