name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Which deploy to run"
        required: true
        default: server
        type: choice
        options:
          - server
          - client
          - both

# Prevent overlapping production deploys (e.g. a workflow_run trigger racing
# a manual workflow_dispatch) from hitting Render/Vercel concurrently.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only deploy when CI passed — never on failure. Manual dispatch skips this
  # requirement since triggering it by hand already implies intent.
  check:
    name: Check CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "Proceeding to deploy"

  # ── Server → Render ───────────────────────────────────────────────────────
  deploy-server:
    name: Deploy server (Render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'server' || github.event.inputs.target == 'both' }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_API_URL }}" \
            -o /dev/null -w "HTTP %{http_code}\n"

  # ── Client → Vercel ───────────────────────────────────────────────────────
  # This step is the ONLY intended deploy path for the client — it explicitly
  # runs `vercel --prod` and only after `check` confirms CI passed. If the
  # Vercel project's own GitHub integration also has "auto-deploy on push"
  # enabled, that deploys on every push to main regardless of CI result,
  # bypassing this gate entirely. Verify auto-deploy is OFF in the Vercel
  # project's Git settings so this workflow is the single source of truth.
  deploy-client:
    name: Deploy client (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'client' || github.event.inputs.target == 'both' }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Vercel
        run: |
          npm install -g vercel --silent
          vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
