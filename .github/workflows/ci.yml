name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Secret scanning ───────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Python / FastAPI server ───────────────────────────────────────────────
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('server/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install audit tools
        run: pip install bandit pip-audit

      - name: Lint (ruff)
        run: ruff check ../server ../worker

      - name: Security scan (bandit)
        run: bandit -r app/ -ll -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Test
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=45
        env:
          PYTHONPATH: .

  # ── Python / trigger worker ──────────────────────────────────────────────
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Install audit tools
        run: pip install bandit pip-audit

      - name: Security scan (bandit)
        run: bandit -r worker/ -ll -q --exclude worker/tests

      - name: Dependency audit
        run: pip-audit -r worker/requirements.txt

      - name: Test
        run: pytest worker/tests/ -v --tb=short
        env:
          PYTHONPATH: .

  # ── Next.js client ────────────────────────────────────────────────────────
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test -- --run

      - name: Dependency audit
        run: npm audit --audit-level=critical
