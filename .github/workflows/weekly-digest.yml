name: Weekly Digest

on:
  schedule:
    # Fixed UTC cron can't track US DST, so both offsets are scheduled;
    # weekly_digest.py's _in_send_window() only actually sends from
    # whichever of these is correct for the current date.
    - cron: "0 21 * * 5"  # Friday 5 PM EDT (UTC-4)
    - cron: "0 22 * * 5"  # Friday 5 PM EST (UTC-5)
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly-digest:
    name: Send weekly digests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-worker-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: pip-worker-

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run weekly digest
        run: python worker/weekly_digest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  notify-on-failure:
    name: Notify on failure
    needs: weekly-digest
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[cron] Weekly Digest is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Workflow run failed: $RUN_URL"
          fi
