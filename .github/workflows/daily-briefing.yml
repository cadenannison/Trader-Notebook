name: Daily Briefing

on:
  schedule:
    # Fixed UTC cron can't track US DST, so both offsets are scheduled;
    # daily_briefing.py's _in_send_window() only actually sends from
    # whichever of these is correct for the current date.
    - cron: "0 12 * * 1-5"  # 8 AM EDT (UTC-4), weekdays only
    - cron: "0 13 * * 1-5"  # 8 AM EST (UTC-5), weekdays only
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    name: Send morning briefings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-worker-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: pip-worker-

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run daily briefing
        run: python worker/daily_briefing.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
