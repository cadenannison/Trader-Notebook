services:
  - type: web
    name: tradrnotebook-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: CLIENT_URL
        sync: false   # set in Render dashboard — your Vercel frontend URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Must be a 64-char hex string (`openssl rand -hex 32`), set manually in
      # the Render dashboard. NOT generateValue: Render generates a random
      # non-hex secret, which fails bytes.fromhex() and breaks every note
      # read/write. Changing this value also makes existing notes permanently
      # undecryptable, so it must be set once and backed up.
      - key: MASTER_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
